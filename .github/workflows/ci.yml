name: Palimpsest release gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned GenLayer tooling
        run: python -m pip install -r requirements.txt
      - name: Run complete offline gate
        run: python scripts/preflight.py
